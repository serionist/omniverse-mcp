[build-system]
# hatch-fancy-pypi-readme makes the README PyPI shows: see [tool.hatch.metadata.hooks.fancy-pypi-readme].
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme==25.1.0"]
build-backend = "hatchling.build"

[project]
name = "omniverse-mcp"
# Equal to extension/ovmcp.bridge/config/extension.toml's version; tests/test_bridge_token.py keeps them equal.
version = "0.2.1"
description = "MCP server for AI control of NVIDIA Omniverse applications (Isaac Sim 5.x and up, USD Composer, and more)"
dynamic = ["readme"]
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Soma Osvay" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "omniverse",
    "isaac-sim",
    "nvidia",
    "robotics",
    "simulation",
    "usd",
    "ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp==2.3.0",
]

[project.urls]
Homepage = "https://github.com/serionist/omniverse-mcp"
Repository = "https://github.com/serionist/omniverse-mcp"
Documentation = "https://github.com/serionist/omniverse-mcp/tree/main/docs"
Issues = "https://github.com/serionist/omniverse-mcp/issues"

[project.scripts]
omniverse-mcp = "omniverse_mcp.server:main"

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "coverage==7.16.2",
    "import-linter==2.15",
    "numpy==2.4.6",
    "pytest==9.2.0",
    "ruff==0.17.1",
    "types-usd==24.5.2",
    "usd-core==26.11",
]

# The README as PyPI shows it, with no repo to resolve relative paths against (#36): images from
# raw.githubusercontent.com and links to GitHub, at main, since a pattern can't name the release's tag. An in-page
# link stays as it is: PyPI prefixes `user-content-` to the link as well as to the heading's id, as GitHub does (#62).
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="(?!https?://)([^"]+)"'
replacement = 'src="https://raw.githubusercontent.com/serionist/omniverse-mcp/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?!https?://|#|mailto:)([^"]+)"'
replacement = 'href="https://github.com/serionist/omniverse-mcp/blob/main/\1"'

# A Markdown image before a link: an image needs the file itself, which a github.com page isn't.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\((?!https?://)([^)\s]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/serionist/omniverse-mcp/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/serionist/omniverse-mcp/blob/main/\1)'

# check-wheel-contents, which release.yml and ci.yml's package job run. W004 (a module at a path Python can't import):
# the wheel carries the Kit extension under omniverse_mcp/_extension/ovmcp.bridge/ as data for `extension install`,
# and its folder's name holds a dot, as Kit's extension ids do; nothing imports it from the wheel.
[tool.check-wheel-contents]
ignore = ["W004"]

[tool.hatch.build.targets.wheel]
packages = ["src/omniverse_mcp"]
# In a development install only, the extension's ovmcp is importable too, for its tests and import-linter. The
# wheel never makes it a package: the server reaches the extension over HTTP alone (import-linter holds that).
dev-mode-dirs = ["src", "extension/ovmcp.bridge"]

# The wheel carries the Kit extension of the same release, for `omniverse-mcp extension install` (plan D9, S8).
[tool.hatch.build.targets.wheel.force-include]
"extension/ovmcp.bridge" = "omniverse_mcp/_extension/ovmcp.bridge"

[tool.hatch.build.targets.sdist]
# tools/ too: tests/test_gate.py and the hook tests import the gate, which reads the plugin.
include = [
    "src/", "extension/", "plugin/", ".claude-plugin/", "tests/", "tools/", "docs/", "README.md", "CHANGELOG.md",
    "LICENSE",
]

# Strict from the start (plan S6): an unknown marker or setting, an xfail that passes, a repeated parametrize id and
# any warning are errors. Each by name rather than `strict`, so a newer pytest can't turn on more unseen. The live
# suites carry the markers sim and scenario, and run only with OMNIVERSE_MCP_SIM=1 (tests/conftest.py, plan D11).
[tool.pytest]
addopts = ["--import-mode=importlib", "-ra"]
testpaths = ["tests"]
strict_config = true
strict_markers = true
strict_parametrization_ids = true
strict_xfail = true
filterwarnings = ["error"]
markers = [
    "sim: needs a Kit app running ovmcp.bridge (tests/test_integration.py)",
    "scenario: the scenario suite, against a Kit app running ovmcp.bridge (tests/test_scenarios.py)",
]

# Coverage of the server and the extension's core, lines and branches; the Kit-bound modules only run inside Kit. The
# floor is what the tests reached when it was set (plan S6); it only rises, and the gate refuses a lower one.
[tool.coverage.run]
source = ["src/omniverse_mcp", "extension/ovmcp.bridge/ovmcp/core"]
branch = true

[tool.coverage.report]
fail_under = 93
precision = 2  # the floor is compared with the total as shown, not rounded to a whole percent
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"  # Kit 107+ embeds 3.11 (plan D8), the server needs 3.11 too
extend-exclude = ["test_project/results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S", "C4", "PTH", "PL", "N", "RET", "TID", "ASYNC", "BLE"]
ignore = [
    "PLR0911", # too many returns: handlers return early on each bad input, which reads better than nesting
    "PLR0912", # too many branches: the same, for handlers that check many optional fields
    "PLR0913", # too many arguments: MCP tools mirror their parameters one to one
    "PLR0915", # too many statements: long handlers are split in S6 and S7, not by a size rule
    "PLR2004", # magic values: pixel margins, angles and HTTP codes read clearer inline
    "PLR0917", # too many positional arguments: the client's methods mirror the bridge's request fields
]

[tool.ruff.lint.per-file-ignores]
"extension/**" = [
    "PLC0415", # Kit modules are imported where they are used: some exist only in some Kit apps, and importing
               # them when the extension loads would fail or slow Kit's startup
]
"tests/**" = [
    "S101",    # assert is how pytest checks
    "PLC0415", # imports inside a test keep a slow or optional import local to it
    "S104",    # binding to all interfaces is what the Host-check test is about
    "S105",    # fake tokens
    "S106",    # fake tokens
    "S108",    # /tmp paths are fixture data the mock bridge echoes, never opened
]
"extension/ovmcp.bridge/ovmcp/bridge/handlers/misc.py" = [
    "S102", # execute_script runs the caller's Python inside Kit: that is the tool
    # baseline (see below): "BLE001", "F841"
    "BLE001",
    "F841",
]
"extension/ovmcp.bridge/ovmcp/core/protocol.py" = [
    "PLW0603", # the extension's version is module state, set once from the ext_id Kit hands on_startup
]

# Baseline (S3a, 2026-10-28): what ruff found that no tool fixes. It only shrinks: a change that clears a rule
# in a file removes it here, and nothing is added to it.
"extension/ovmcp.bridge/ovmcp/bridge/extension.py" = ["BLE001", "S110"]
"extension/ovmcp.bridge/ovmcp/bridge/handlers/__init__.py" = ["RUF022"]
"extension/ovmcp.bridge/ovmcp/bridge/handlers/_mcp_bridge.py" = ["RUF013"]
"extension/ovmcp.bridge/ovmcp/bridge/handlers/_utils.py" = ["B904", "BLE001", "S110"]
"extension/ovmcp.bridge/ovmcp/bridge/handlers/camera.py" = ["ASYNC230", "ASYNC240", "B904", "BLE001", "PTH108", "PTH110", "PTH118", "PTH123", "PTH202", "S110", "SIM105"]
"extension/ovmcp.bridge/ovmcp/bridge/handlers/recording.py" = ["ASYNC230", "ASYNC240", "BLE001", "F841", "PLW0602", "PTH103", "PTH110", "PTH118", "PTH123", "PTH202", "RUF006"]
"extension/ovmcp.bridge/ovmcp/bridge/handlers/robot.py" = ["BLE001"]
"extension/ovmcp.bridge/ovmcp/bridge/handlers/scene.py" = ["ASYNC230", "ASYNC240", "BLE001", "PTH103", "PTH118", "PTH123", "PTH202", "S110"]
"extension/ovmcp.bridge/ovmcp/bridge/handlers/simulation.py" = ["BLE001"]
"extension/ovmcp.bridge/ovmcp/bridge/handlers/usd_advanced.py" = ["BLE001", "S110", "S112"]
"extension/ovmcp.bridge/ovmcp/core/formatter.py" = ["BLE001", "S110"]
"extension/ovmcp.bridge/ovmcp/core/http.py" = ["ASYNC109", "BLE001"]
"extension/ovmcp.bridge/ovmcp/core/token.py" = ["PTH105"]
"src/omniverse_mcp/bridge_token.py" = ["S105"]
"src/omniverse_mcp/client.py" = ["B904", "BLE001", "S110", "SIM105"]
"src/omniverse_mcp/server.py" = ["BLE001", "E402", "PTH103", "PTH109", "PTH118", "PTH123"]
"src/omniverse_mcp/tools/__init__.py" = ["TID252"]
"src/omniverse_mcp/tools/camera.py" = ["BLE001", "E501", "PTH103", "PTH109", "PTH117", "PTH118", "PTH123"]
"src/omniverse_mcp/tools/misc.py" = ["BLE001"]
"src/omniverse_mcp/tools/recording.py" = ["BLE001", "PTH118"]
"src/omniverse_mcp/tools/robot.py" = ["BLE001"]
"src/omniverse_mcp/tools/scene.py" = ["BLE001"]
"src/omniverse_mcp/tools/simulation.py" = ["BLE001"]
"src/omniverse_mcp/tools/usd_advanced.py" = ["BLE001", "E501"]
"tests/test_client.py" = ["RUF059"]
"tests/test_framing.py" = ["RUF043"]
"tests/test_integration.py" = ["B904", "BLE001", "S110", "SIM105"]
"tests/test_isolation.py" = ["B017"]
"tests/test_scenarios.py" = ["B904", "BLE001", "E501", "E741", "PTH103", "PTH107", "PTH110", "PTH118", "PTH120", "PTH123", "S110", "SIM105"]

[tool.ruff.lint.isort]
known-first-party = ["omniverse_mcp", "ovmcp"]

# What the import graph keeps (plan S6), checked by `uv run lint-imports` and the gate. Imports inside functions
# count too. The extension's core runs without Kit, so its tests run anywhere; the server reaches the extension over
# HTTP alone, so its wheel works with no Kit beside it.
[tool.importlinter]
root_packages = ["ovmcp", "omniverse_mcp"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The extension's core imports no Kit"
type = "forbidden"
source_modules = ["ovmcp.core"]
forbidden_modules = ["ovmcp.bridge", "omni", "carb", "isaacsim"]

[[tool.importlinter.contracts]]
name = "The server imports nothing of the extension"
type = "forbidden"
source_modules = ["omniverse_mcp"]
forbidden_modules = ["ovmcp"]

# basedpyright is pyright with a baseline: the errors of today live in .basedpyright/baseline.json and may only
# shrink, the same ratchet as ruff's per-file ignores. New code is checked in full.
[tool.basedpyright]
typeCheckingMode = "standard"
# Strict where all the code is ours and every import has types: the extension's Kit-free core and the server.
# Tests stay standard, their fakes loose on purpose.
strict = ["extension/ovmcp.bridge/ovmcp/core", "src/omniverse_mcp"]
pythonVersion = "3.11"
include = ["src", "tests", "tools", "extension/ovmcp.bridge/ovmcp/core"]
# The Kit-bound modules import omni, carb and isaacsim, which have no stubs outside Kit.
exclude = ["extension/ovmcp.bridge/ovmcp/bridge", "**/__pycache__", ".venv"]
extraPaths = ["extension/ovmcp.bridge", "tools"]
