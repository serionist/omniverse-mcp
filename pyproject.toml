[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "omniverse-mcp"
# Equal to extension/ovmcp.bridge/config/extension.toml's version; tests/test_bridge_token.py keeps them equal.
version = "0.1.0"
description = "MCP server for AI control of NVIDIA Omniverse applications (Isaac Sim 5.1+, USD Composer, and more)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Soma Osvay" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "omniverse",
    "isaac-sim",
    "nvidia",
    "robotics",
    "simulation",
    "usd",
    "ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.0.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/serionist/omniverse-mcp"
Repository = "https://github.com/serionist/omniverse-mcp"
Documentation = "https://github.com/serionist/omniverse-mcp/tree/main/docs"
Issues = "https://github.com/serionist/omniverse-mcp/issues"

[project.scripts]
omniverse-mcp = "omniverse_mcp.server:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.1",
    "usd-core==26.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/omniverse_mcp"]

# The wheel carries the Kit extension of the same release, for `omniverse-mcp extension install` (plan D9, S8).
[tool.hatch.build.targets.wheel.force-include]
"extension/ovmcp.bridge" = "omniverse_mcp/_extension/ovmcp.bridge"

[tool.hatch.build.targets.sdist]
include = ["src/", "extension/", "tests/", "docs/", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py311"  # Kit 107+ embeds 3.11 (plan D8), the server needs 3.11 too
extend-exclude = ["test_project/results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S", "C4", "PTH", "PL", "N", "RET", "TID", "ASYNC", "BLE"]
ignore = [
    "PLR0911", # too many returns: handlers return early on each bad input, which reads better than nesting
    "PLR0912", # too many branches: the same, for handlers that check many optional fields
    "PLR0913", # too many arguments: MCP tools mirror their parameters one to one
    "PLR0915", # too many statements: long handlers are split in S6 and S7, not by a size rule
    "PLR2004", # magic values: pixel margins, angles and HTTP codes read clearer inline
    "PLR0917", # too many positional arguments: the client's methods mirror the bridge's request fields
]

[tool.ruff.lint.per-file-ignores]
"extension/**" = [
    "PLC0415", # Kit modules are imported where they are used: some exist only in some Kit apps, and importing
               # them when the extension loads would fail or slow Kit's startup
]
"tests/**" = [
    "S101",    # assert is how pytest checks
    "PLC0415", # imports inside a test keep a slow or optional import local to it
]

[tool.ruff.lint.isort]
known-first-party = ["omniverse_mcp", "ovmcp"]
