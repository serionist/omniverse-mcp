[package]
# Equal to pyproject.toml's version; tests/test_bridge_token.py keeps them equal.
version = "0.2.3"
category = "Simulation"
title = "Omniverse MCP Bridge"
description = "HTTP bridge enabling AI assistants to control Omniverse applications via the Model Context Protocol"
authors = ["Soma Osvay"]
readme = "docs/README.md"

[dependencies]
"omni.kit.uiapp" = { optional = true }
# A recording's camera feed renders with them; optional, so Kit loads them first where it has them and the bridge still
# loads in a Kit app without them.
"omni.kit.hydra_texture" = { optional = true }
"omni.kit.widget.viewport" = { optional = true }

[[python.module]]
name = "ovmcp.bridge"

[settings]
exts."ovmcp.bridge".host = "127.0.0.1"
exts."ovmcp.bridge".port = 8211
# Empty: a new random token at every start, written to the token file. Set it only for a remote MCP server,
# which then gets the same value in OMNIVERSE_MCP_TOKEN.
exts."ovmcp.bridge".token = ""
