# The PR's title and description, checked whenever they change: a squash merge makes them the commit on main, so they
# carry no tool attribution (plan D1) and name the issue. The gate in ci.yml checks the branch's commits; this checks
# the text, in a workflow of its own so that an edit re-runs only this. It runs again on every push too, so the PR's
# head commit always carries it.
#
# Dependabot's PRs are skipped: their descriptions quote other projects' release notes, which may say anything, and
# their squash message keeps only the title and a line naming what moved (AGENTS.md, Commits and PRs). A job
# skipped by its `if` reports success, so the required check still passes.
#
# It runs on pull_request, never pull_request_target: a fork's PR gets a read-only token and no secrets, and this
# workflow asks for none. The title and description are read from GitHub's event file, never put into the script by an
# expression, so no text in them can run as shell.
name: PR text

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-text-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  text:
    name: PR text
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The gate is standard library only, so it runs without the project's packages (--no-sync). With nothing
      # installed there is nothing to cache, and setup-uv's cache step would fail on an empty cache folder.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: No tool attribution, and the issue named
        run: |
          jq -r '.pull_request.title, (.pull_request.body // "")' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/pr-text.txt"
          uv run --no-sync tools/gate.py text --file "$RUNNER_TEMP/pr-text.txt"
