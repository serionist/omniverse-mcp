# Dependabot's minor and patch updates merge themselves once the required checks pass (plan D16). This job only turns
# on GitHub's auto-merge when Dependabot opens or updates a PR; GitHub then waits for CI and PR text, the checks the
# main ruleset requires, and squash-merges. A major update is left for the maintainer: CI runs the unit tests on every
# OS, never the live Kit suites (plan D11), and a major is where a dependency changes what the bridge or the server
# does.
#
# The squash commit gets the PR's title and one line naming what moved, never the description: Dependabot's
# description quotes other projects' release notes (AGENTS.md, Commits and PRs).
#
# GitHub records the merge as github-actions[bot], since the workflow's token turned auto-merge on, and a push made
# with that token starts no workflow: CI and CodeQL don't run on main for it. ci.yml's daily run and CodeQL's weekly
# one test main afterwards instead, a gap the maintainer agreed to on 2026-10-28 over a GitHub App's token, which would
# close it at the cost of a standing credential (plan D16).
#
# To hold an update, convert its PR to draft: nobody can merge a draft, and this job skips one; marking it ready for
# review turns auto-merge on again. Turning auto-merge off by hand holds it only until Dependabot next pushes to the PR.
#
# It runs on pull_request for Dependabot's own PRs on this repository only. Such a run gets a read-only token unless
# the workflow asks for more, so the job asks for the two permissions turning on auto-merge needs. Nothing is checked
# out and no PR code runs. The PR's title and the update's metadata reach the script through env, never an
# expression, so no text in them can run as shell.
name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Auto-merge
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' && !github.event.pull_request.draft &&
      github.repository == 'serionist/omniverse-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the squash merge, once the checks pass
      pull-requests: write # turning on auto-merge
    steps:
      - name: Read the update's type
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Turn on auto-merge for a minor or patch update
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          UPDATED: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          # A grouped PR's title only counts what moved; the line names each, with versions when Dependabot gave them.
          bumps=$(jq -r 'map(.dependencyName + (if (.prevVersion // "") != "" and (.newVersion // "") != ""
            then " " + .prevVersion + " to " + .newVersion else "" end)) | join(", ")' <<<"$UPDATED")
          gh pr merge --auto --squash "$PR_URL" \
            --subject "$PR_TITLE (#$PR_NUMBER)" \
            --body "Bumps $bumps, a ${UPDATE_TYPE#version-update:semver-} update; the release notes are in #$PR_NUMBER."
