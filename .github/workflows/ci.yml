# The gate on every pull request, every push to main and once a day on main. Checks (Linux) runs the gate's quick lane
# (lock, lint, format, types, the harness, no tool attribution in the commits, gitleaks over them); the tests run on
# Linux on Python 3.11 to 3.14, on Windows on 3.11 and 3.14, and on macOS on 3.14 (plan D8). CI needs both; it and
# pr-text.yml's PR text are the two checks the ruleset on main requires. The live suites need a Kit app and skip
# themselves here: hosted CI never runs Kit (plan D11), so a PR that touches the extension, the client or a tool says
# whether they ran.
#
# The daily run is for Dependabot's merges: dependabot-auto-merge.yml turns on auto-merge with the workflow's token,
# and a push made with that token starts no run, so main is tested within a day of one instead (plan D16).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: read

concurrency:
  # Superseded PR runs are cancelled. Each run on main, a push or the daily one, has a group per commit and keeps its
  # own result: one group for main would cancel a waiting run when the next push came.
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The attribution and secret checks read the commits since the base, which a shallow clone doesn't have.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
      # The commits checked start after the PR's base, or after the commit main was on before the push. A PR's checkout
      # is the merge of its branch into the base, so that merge is checked too. A push's before is all zeros for a new
      # branch, and a commit no longer in the history after a force push; the daily run has none. Then the head commit
      # alone is checked, since a squash merge is one commit. --locked fails on a stale uv.lock before anything is
      # installed. GATE_REQUIRE_GITLEAKS makes a missing gitleaks a failure, not a warning.
      - name: The gate's quick lane
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GATE_REQUIRE_GITLEAKS: "1"
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::notice::${BASE:-no base} is not in the history; checking HEAD~1..HEAD"
            BASE=HEAD~1
          fi
          uv run --locked tools/gate.py quick --base "$BASE"

  tests:
    name: Tests (${{ matrix.name }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: Linux, python: "3.11" }
          - { os: ubuntu-latest, name: Linux, python: "3.12" }
          - { os: ubuntu-latest, name: Linux, python: "3.13" }
          - { os: ubuntu-latest, name: Linux, python: "3.14" }
          - { os: windows-latest, name: Windows, python: "3.11" }
          - { os: windows-latest, name: Windows, python: "3.14" }
          - { os: macos-latest, name: macOS, python: "3.14" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
      # uv run makes the environment on the leg's Python, which overrides .python-version's 3.12, and fails on a stale
      # uv.lock before anything is installed.
      - name: Tests
        run: uv run --locked --python ${{ matrix.python }} pytest

  # The check the ruleset on main requires: the checks and every test leg passed. It runs when one of them failed too,
  # since a skipped job would count as passed.
  ci:
    name: CI
    needs: [checks, tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The checks and every test leg passed
        env:
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.tests.result }}
        run: test "$CHECKS" = success && test "$TESTS" = success
