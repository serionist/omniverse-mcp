name: Bug report
description: Something the MCP server, a tool or the Kit extension does wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste the bridge token: not the contents of a `bridge-<port>.token` file, not `OMNIVERSE_MCP_TOKEN`, not the extension's `token` setting. Anyone who holds it can run code in your Kit app. A security vulnerability goes through a [private report](https://github.com/serionist/omniverse-mcp/security/advisories/new), never an issue.
  - type: input
    id: kit
    attributes:
      label: Kit app and version
      description: "The `kit_app` and `kit_version` that `get_sim_state` reports; with an extension of 0.3.0 or older, Help > About in the Kit app."
      placeholder: Isaac-Sim Python 6.2.0 (Kit 110.4.0+...)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: "Kit's is the `kit_os` that `get_sim_state` reports. Both, if Kit and the MCP server run on different machines."
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client and version
      placeholder: Claude Code 2.1.0
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Server version or commit
      description: "The `server_version` that `get_sim_state` reports, or `uvx omniverse-mcp==<version>` in your MCP client's config; from a clone, the commit it is on: `git rev-parse --short HEAD`."
      placeholder: "X.Y.Z, or a commit"
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: "The `extension_version` that `get_sim_state` reports. Kit's console shows it at startup: `[ext: ovmcp.bridge-X.Y.Z] startup`."
      placeholder: X.Y.Z
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The tool and its arguments, or what you asked the assistant; the scene it ran on; what came back.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Console log
      description: Kit's console around the error (Window > Console, or the terminal Kit runs in), and the MCP client's log of the server if it shows one. Take out any token first.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: Nothing above holds the bridge token, or any other key, token or password.
          required: true
